services:
  - type: web
    name: getcrag-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_FAST_MODEL
        value: gemini-3.5-flash-lite
      - key: JINA_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DISCORD_INVITE_URL
        sync: false
      - key: DISCORD_LINK_CODE_SECRET
        sync: false
      - key: DISCORD_BACKEND_SHARED_SECRET
        sync: false
      - key: RESEARCH_ADMIN_SHARED_SECRET
        sync: false

  - type: worker
    name: getcrag-discord-bot
    runtime: python
    rootDir: discord_bot
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: BACKEND_API_URL
        sync: false
      - key: DISCORD_BACKEND_SHARED_SECRET
        sync: false
      - key: REQUEST_TIMEOUT
        value: "30"
      - key: SESSION_TIMEOUT
        value: "3600"
      - key: LOG_LEVEL
        value: INFO

  - type: static
    name: getcrag-lms-management
    rootDir: frontend/lms-management
    buildCommand: npm install && (cd ../shared && npm install) && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
